# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy Node.js app to Azure Web App: pgb-ecash-api'

on:
  push:
    branches:
    - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js version
      uses: actions/setup-node@v1
      with:
        node-version: '22.x'
    
    - name: npm install, build, and test
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    # Les migrations (prisma/migrations/*) n'étaient jamais appliquées à la base de
    # production par ce pipeline — seul `npm install` tournait (postinstall: prisma
    # generate, qui régénère le client mais ne touche pas le schéma réel en base).
    # Le code déployé pouvait donc s'attendre à des colonnes/tables absentes de la
    # vraie base. Nécessite un secret de dépôt `DATABASE_URL` pointant vers la base
    # Postgres de production (Settings → Secrets and variables → Actions).
    - name: Appliquer les migrations Prisma à la base de production
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v2
      with: 
        app-name: 'pgb-ecash-api'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_49631716a83448aeb78117fe66602bec }}
        package: .
