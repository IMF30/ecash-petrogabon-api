# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy Node.js app to Azure Web App: pgb-ecash-api'

on:
  push:
    branches:
    - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        # Doit correspondre au runtime de l'App Service (NODE|24-lts) : les dépendances sont
        # installées ici puis déployées telles quelles.
        node-version: '24.x'

    - name: npm install, build, and test
      run: |
        npm ci
        npm run build --if-present
        npm run test --if-present

    # Migrations Prisma : appliquées au DÉMARRAGE de l'App Service (script "start" de
    # package.json : prisma migrate deploy && node dist/main.js), et non plus ici. Les lancer
    # depuis GitHub Actions obligeait à ouvrir le port Postgres de la VM à tout Internet (les
    # runners GitHub n'ont pas d'IP fixe) et à stocker le mot de passe de la base dans GitHub.
    # La base n'a plus à accepter que les IP sortantes de pgb-ecash-api.

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'pgb-ecash-api'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_49631716a83448aeb78117fe66602bec }}
        package: .
